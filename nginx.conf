events {
    worker_connections 1024;
}

http {
    upstream fleet {
        server fleet-tracker:8000;
    }

    # Rate limiting for trackers (prevent spam)
    limit_req_zone $binary_remote_addr zone=trackers:10m rate=10r/s;

    # HTTP server - for SIM800L trackers (must be plain HTTP on port 80)
    server {
        listen 80;
        server_name _;  # Replace with your domain e.g. fleet.yourdomain.com

        # For Let's Encrypt verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Tracker endpoints - no rate limit too strict, but protect
        location /api/v1/geolinker {
            limit_req zone=trackers burst=20 nodelay;
            proxy_pass http://fleet;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10k;
        }

        location /api/track {
            limit_req zone=trackers burst=20 nodelay;
            proxy_pass http://fleet;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Redirect all other HTTP to HTTPS for dashboard (optional - comment out if you want HTTP dashboard)
        location / {
            # For pure HTTP setup (simplest for SIM800L + dashboard both HTTP):
            proxy_pass http://fleet;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # If you have domain + SSL, uncomment this to redirect dashboard to HTTPS:
            # return 301 https://$host$request_uri;
        }
    }

    # HTTPS server - for dashboard (secure)
    # Uncomment when you have SSL certs via Let's Encrypt
    # server {
    #     listen 443 ssl;
    #     server_name fleet.yourdomain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/fleet.yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/fleet.yourdomain.com/privkey.pem;
    #
    #     location / {
    #         proxy_pass http://fleet;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}
